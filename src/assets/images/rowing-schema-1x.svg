<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
<title id="title">Einer 1x – technisches Ruderschema</title>
<desc id="desc">Direkte Draufsicht eines Renn-Einers mit einer Person und je einem Skull auf Backbord und Steuerbord.</desc>
<defs>
  <style>
    .hull{stroke:#0B2336;stroke-width:4;stroke-linejoin:round}.tech{stroke:#0B2336;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}.shaft{stroke:#123A57;stroke-width:6;stroke-linecap:round}.seat{fill:#123A57;stroke:#0B2336;stroke-width:3}.foot{stroke:#0B2336;stroke-width:5;stroke-linecap:round}.rower{fill:#F7F5EF;stroke:#0B2336;stroke-width:3}.head{fill:#A9DCEB;stroke:#0B2336;stroke-width:3}.arm{stroke:#0B2336;stroke-width:8;stroke-linecap:round}.hand{fill:#A6342B;stroke:#0B2336;stroke-width:2}.oarlock{fill:#92D6EA;stroke:#0B2336;stroke-width:3}.blade{fill:#A6342B;stroke:#0B2336;stroke-width:3;stroke-linejoin:round}
  </style>
  <filter id="ae-shadow-filter" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0B2336" flood-opacity="0.16"/></filter>
  <symbol id="ae-seat" viewBox="-18 -12 36 24"><rect x="-18" y="-12" width="36" height="24" rx="6" class="seat"/></symbol>
  <symbol id="ae-oarlock" viewBox="-10 -10 20 20"><circle r="8" class="oarlock"/><circle r="2.6" fill="#0B2336"/></symbol>
  <symbol id="ae-head" viewBox="-13 -13 26 26"><circle r="12" class="head"/></symbol>
  <symbol id="ae-torso" viewBox="-25 -18 50 36"><rect x="-24" y="-17" width="48" height="34" rx="15" class="rower"/></symbol>
</defs>
<g id="boat-1x">
  <path d="M220 280 C300 245 600 244 800 244 C1000 244 1300 250 1380 280 C1300 310 1000 316 800 316 C600 316 300 315 220 280 Z" fill="#F7F5EF" class="hull" filter="url(#ae-shadow-filter)"/>
  <path d="M650 280 C700 252 900 252 950 280 C900 308 700 308 650 280 Z" fill="#92D6EA" opacity=".24"/>
  <g id="seat-1"><use href="#ae-seat" x="782" y="268" width="36" height="24"/></g>
  <g id="foot-stretcher-1"><line x1="745" y1="258" x2="745" y2="302" class="foot"/></g>
  <g id="rigger-port-1" class="tech"><line x1="775" y1="262" x2="800" y2="214"/><line x1="825" y1="262" x2="800" y2="214"/></g>
  <g id="rigger-starboard-1" class="tech"><line x1="775" y1="298" x2="800" y2="346"/><line x1="825" y1="298" x2="800" y2="346"/></g>
  <g id="scull-port-1"><line x1="845" y1="300" x2="732.77" y2="85.53" class="shaft"/><polygon points="737.84,82.87 712.77,19.25 689.73,31.3 727.71,88.18" class="blade"/><use href="#ae-oarlock" x="790" y="204" width="20" height="20"/></g>
  <g id="scull-starboard-1"><line x1="845" y1="260" x2="732.77" y2="474.47" class="shaft"/><polygon points="727.71,471.82 689.73,528.7 712.77,540.75 737.84,477.13" class="blade"/><use href="#ae-oarlock" x="790" y="336" width="20" height="20"/></g>
  <g id="rower-1" filter="url(#ae-shadow-filter)"><use href="#ae-torso" x="775" y="262" width="50" height="36"/><use href="#ae-head" x="817" y="267" width="26" height="26"/><line x1="807" y1="270" x2="845" y2="260" class="arm"/><line x1="807" y1="290" x2="845" y2="300" class="arm"/><circle cx="845" cy="260" r="6" class="hand"/><circle cx="845" cy="300" r="6" class="hand"/></g>
