name: Diagnose Club Logo UI

on:
  push:
    branches: [feat/karl-adam-local-cooperation]
    paths:
      - '.github/workflows/diagnose-club-logo-ui.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/karl-adam-local-cooperation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Build local
        run: npm run build:local
      - name: Verify RRC logo in built data and filesystem
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('dist/data/clubs.json', 'utf8'));
          const withLogo = data.organizations.filter((org) => org.logoStatus === 'present');
          console.log('logo-bearing organizations:', withLogo.map((org) => ({ id: org.id, name: org.name, logo: org.logo })));
          const rrc = data.organizations.find((org) => org.id === 'ratzeburger-ruderclub-ev');
          console.log('RRC:', rrc);
          if (!rrc) throw new Error('RRC missing from built data');
          if (rrc.logoStatus !== 'present' || !rrc.logo) throw new Error('RRC has no present logo in built data');
          const path = `dist${rrc.logo}`;
          if (!fs.existsSync(path)) throw new Error(`RRC logo file missing: ${path}`);
          console.log('RRC logo file exists:', path, fs.statSync(path).size, 'bytes');
          NODE
      - name: Verify built UI contains logo renderer
        run: |
          grep -q 'function clubLogoMarkup' dist/assets/app.js
          grep -q 'club-logo' dist/assets/styles.css
      - name: Serve and fetch RRC logo
        run: |
          python3 -m http.server 8765 --directory dist >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          sleep 1
          LOGO=$(node -e "const d=require('./dist/data/clubs.json'); console.log(d.organizations.find(o=>o.id==='ratzeburger-ruderclub-ev').logo)")
          echo "Fetching $LOGO"
          curl --fail --silent --show-error -I "http://127.0.0.1:8765${LOGO}"
          kill $SERVER_PID
