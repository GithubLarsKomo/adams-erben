name: DRV Registry Quality

on:
  workflow_dispatch:
  push:
    branches: [feat/mvp-wayfinder]
    paths:
      - 'scripts/sync-drv.mjs'
      - 'scripts/enrich-lrv.mjs'
      - 'scripts/enrich-lrv-laenderrat.mjs'
      - 'scripts/enrich-lrv-laenderrat.test.mjs'
      - 'scripts/build-snapshot.mjs'
      - 'scripts/build-snapshot.test.mjs'
      - 'scripts/build-snapshot-lrv-identity.test.mjs'
      - 'scripts/prepare-pilot-100.mjs'
      - 'scripts/prepare-pilot-100.test.mjs'
      - 'scripts/lib/drv-registry.mjs'
      - 'scripts/lib/drv-registry.test.mjs'
      - 'scripts/lib/drv-registry-website.test.mjs'
      - 'scripts/lib/contact-governance.mjs'
      - 'scripts/lib/lrv-identity.mjs'
      - 'scripts/prepare-discovery-poc.mjs'
      - 'scripts/prepare-discovery-poc.test.mjs'
      - 'package.json'
      - '.github/workflows/registry-sync.yml'
  pull_request:
    paths:
      - 'scripts/sync-drv.mjs'
      - 'scripts/enrich-lrv.mjs'
      - 'scripts/enrich-lrv-laenderrat.mjs'
      - 'scripts/enrich-lrv-laenderrat.test.mjs'
      - 'scripts/build-snapshot.mjs'
      - 'scripts/build-snapshot.test.mjs'
      - 'scripts/build-snapshot-lrv-identity.test.mjs'
      - 'scripts/prepare-pilot-100.mjs'
      - 'scripts/prepare-pilot-100.test.mjs'
      - 'scripts/lib/drv-registry.mjs'
      - 'scripts/lib/drv-registry.test.mjs'
      - 'scripts/lib/drv-registry-website.test.mjs'
      - 'scripts/lib/contact-governance.mjs'
      - 'scripts/lib/lrv-identity.mjs'
      - 'scripts/prepare-discovery-poc.mjs'
      - 'scripts/prepare-discovery-poc.test.mjs'
      - 'package.json'
      - '.github/workflows/registry-sync.yml'

permissions:
  contents: read

jobs:
  registry-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test registry, governance, sampling and discovery
        run: |
          npm run test:drv-registry
          npm run test:contact-governance
          npm run test:snapshot
          npm run test:lrv-laenderrat
          npm run test:pilot-prepare
          npm run test:discover-prepare
          node --check scripts/enrich-lrv.mjs
          node --check scripts/enrich-lrv-laenderrat.mjs
          node --check scripts/prepare-pilot-100.mjs

      - name: Run full DRV registry sync
        env:
          REQUIRE_DRV_SYNC: '1'
          DRV_SYNC_REQUIRED_COVERAGE: '0.95'
          DRV_SYNC_CONCURRENCY: '3'
          DRV_SYNC_DELAY_MS: '300'
          DRV_SYNC_LIMIT: '0'
        run: npm run sync:drv

      - name: Build registry-only governance snapshot baseline
        run: |
          npm run snapshot:build
          cp artifacts/snapshot/report.json artifacts/snapshot/baseline-registry.json
          cp artifacts/snapshot/report.md artifacts/snapshot/baseline-registry.md

      - name: Enrich LRV fallback contacts from official websites
        env:
          LRV_ENRICH_DELAY_MS: '700'
          LRV_ENRICH_MAX_PAGES: '5'
        run: npm run lrv:enrich

      - name: Enrich LRV contacts from official DRV Länderrat
        run: npm run lrv:laenderrat

      - name: Build governance snapshot with LRV enrichment
        env:
          SNAPSHOT_CONTACT_CANDIDATES_FILE: build-private/contact-candidates.json
        run: npm run snapshot:build

      - name: Prepare deterministic 100-club pilot sample
        env:
          PILOT_SAMPLE_TARGET: '100'
          PILOT_SAMPLE_SEED: 'adams-erben-pilot-100-v1'
          PILOT_STATE_FLOOR: '3'
          PILOT_ROUTE_FLOOR: '30'
        run: npm run pilot:prepare

      - name: Prepare up to 25 missing-website cases from registry queue
        env:
          DISCOVERY_SAMPLE_TARGET: '25'
          DISCOVERY_SAMPLE_MIN_SIZE: '20'
          DISCOVERY_SAMPLE_MIN_STATES: '5'
          DISCOVERY_SAMPLE_MAX_PER_STATE: '5'
        run: npm run poc:discover:prepare

      - name: Publish address-free discovery sample
        run: |
          mkdir -p artifacts/drv-registry
          node - <<'NODE'
          const fs = require('fs');
          const input = JSON.parse(fs.readFileSync('build-private/website-discovery-input.json', 'utf8'));
          fs.writeFileSync('artifacts/drv-registry/discovery-sample.json', JSON.stringify(input, null, 2));
          NODE

      - name: Validate registry, LRV, pilot, snapshot and privacy gates
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('artifacts/drv-registry/report.json', 'utf8'));
          const baseline = JSON.parse(fs.readFileSync('artifacts/snapshot/baseline-registry.json', 'utf8'));
          const snapshot = JSON.parse(fs.readFileSync('artifacts/snapshot/report.json', 'utf8'));
          const lrv = JSON.parse(fs.readFileSync('artifacts/lrv-enrichment/report.json', 'utf8'));
          const laenderrat = JSON.parse(fs.readFileSync('artifacts/lrv-laenderrat/report.json', 'utf8'));
          const pilot = JSON.parse(fs.readFileSync('artifacts/pilot-100/report.json', 'utf8'));
          const pilotSample = JSON.parse(fs.readFileSync('artifacts/pilot-100/sample.json', 'utf8'));
          const missing = JSON.parse(fs.readFileSync('build-private/website-missing.json', 'utf8'));
          const discoverySample = JSON.parse(fs.readFileSync('artifacts/drv-registry/discovery-sample.json', 'utf8'));
          const publicClubs = JSON.parse(fs.readFileSync('dist/data/clubs.json', 'utf8'));
          const recipients = JSON.parse(fs.readFileSync('build-private/recipients.json', 'utf8'));

          if (report.coveragePct < 95) throw new Error(`registry coverage below 95%: ${report.coveragePct}`);
          if (report.discoveredProfiles < 400) throw new Error(`unexpectedly small DRV registry: ${report.discoveredProfiles}`);
          if (report.clubs < 300) throw new Error(`unexpectedly small club count: ${report.clubs}`);
          if (report.lrv !== report.expectedLrv || report.expectedLrv !== 15) throw new Error(`LRV registry incomplete: ${report.lrv}/${report.expectedLrv}`);
          if (report.lrvCoveragePct !== 100 || (report.missingLrvIds || []).length) throw new Error(`LRV coverage invalid: ${report.lrvCoveragePct}% missing=${(report.missingLrvIds || []).join(',')}`);

          if (!Array.isArray(missing.organizations)) throw new Error('website-missing queue missing');
          if (missing.organizations.length !== report.clubsMissingWebsiteFromDrv) throw new Error(`website-missing mismatch: ${missing.organizations.length} != ${report.clubsMissingWebsiteFromDrv}`);
          const expectedDiscoverySize = Math.min(25, missing.organizations.length);
          if (!Array.isArray(discoverySample.organizations) || discoverySample.organizations.length !== expectedDiscoverySize) throw new Error(`discovery sample must contain ${expectedDiscoverySize} organizations, got ${discoverySample.organizations?.length}`);
          if (discoverySample.organizations.length < 20) throw new Error(`discovery sample too small: ${discoverySample.organizations.length}`);
          const discoveryStates = new Set(discoverySample.organizations.map((item) => item.state).filter(Boolean));
          if (discoveryStates.size < 5) throw new Error(`discovery sample has only ${discoveryStates.size} states`);

          if (lrv.summary.targets < 1 || lrv.summary.targets > 15) throw new Error(`unexpected LRV enrichment target count: ${lrv.summary.targets}`);
          if (laenderrat.lrvRegistryCount !== 15) throw new Error(`unexpected Länderrat LRV registry count: ${laenderrat.lrvRegistryCount}`);
          if (laenderrat.matchedOrganizations < 1 || laenderrat.autoApprovedCandidateCount < 1) throw new Error('DRV Länderrat produced no safe LRV role candidate');
          if (snapshot.policyVersion !== '1.1.0' || baseline.policyVersion !== '1.1.0') throw new Error('unexpected contact policy version');
          if (snapshot.registryOrganizations !== report.parsedProfiles || baseline.registryOrganizations !== report.parsedProfiles) throw new Error('snapshot/registry count mismatch');
          for (const current of [baseline, snapshot]) {
            const routed = current.routeCounts.club + current.routeCounts.lrv + current.routeCounts.drv;
            if (routed !== current.registryOrganizations) throw new Error(`snapshot routes incomplete: ${routed}/${current.registryOrganizations}`);
          }
          if (snapshot.directApproved < baseline.directApproved) throw new Error(`LRV enrichment reduced direct approvals: ${snapshot.directApproved} < ${baseline.directApproved}`);
          if (snapshot.routeCounts.drv > baseline.routeCounts.drv) throw new Error(`LRV enrichment increased DRV fallbacks: ${snapshot.routeCounts.drv} > ${baseline.routeCounts.drv}`);
          if (!Array.isArray(publicClubs.organizations) || publicClubs.organizations.length !== snapshot.publicOrganizations) throw new Error('public snapshot organization count mismatch');
          if (!recipients.recipients || Object.keys(recipients.recipients).length !== snapshot.publicOrganizations) throw new Error('private recipient snapshot count mismatch');

          if (pilot.samplerVersion !== 'pilot-100/1.0.0') throw new Error(`unexpected pilot sampler: ${pilot.samplerVersion}`);
          if (pilot.sample !== 100 || pilot.target !== 100) throw new Error(`pilot sample size invalid: ${pilot.sample}/${pilot.target}`);
          if (!Array.isArray(pilotSample.organizations) || pilotSample.organizations.length !== 100) throw new Error('pilot sample artifact must contain 100 organizations');
          const pilotIds = pilotSample.organizations.map((item) => item.organizationId);
          if (new Set(pilotIds).size !== 100) throw new Error('pilot sample contains duplicate organization IDs');
          if (pilot.sampleStates.length !== pilot.populationStates.length || pilot.populationStates.length !== 16) {
            throw new Error(`pilot state coverage invalid: ${pilot.sampleStates.length}/${pilot.populationStates.length}`);
          }
          const populationClubRows = publicClubs.organizations.filter((item) => item.type === 'club');
          const populationByState = Object.create(null);
          for (const row of populationClubRows) if (row.state) populationByState[row.state] = (populationByState[row.state] || 0) + 1;
          for (const [state, population] of Object.entries(populationByState)) {
            const required = Math.min(3, population);
            if ((pilot.stateCounts[state] || 0) < required) throw new Error(`pilot state floor not met for ${state}: ${pilot.stateCounts[state] || 0}/${required}`);
          }
          for (const key of ['websiteMissing', 'drvFallback', 'stateMissing', 'https']) {
            if (pilot.mandatoryIncluded[key] !== pilot.mandatoryPopulation[key]) {
              throw new Error(`pilot mandatory stratum incomplete for ${key}: ${pilot.mandatoryIncluded[key]}/${pilot.mandatoryPopulation[key]}`);
            }
          }
          if ((pilot.routeCounts.club || 0) < 30 || (pilot.routeCounts.lrv || 0) < 30) throw new Error(`pilot route floors invalid: ${JSON.stringify(pilot.routeCounts)}`);
          for (const scheme of ['http', 'https', 'missing']) {
            if (!(pilot.schemeCounts[scheme] > 0)) throw new Error(`pilot lacks ${scheme} website class`);
          }

          const publicRaw = [
            'artifacts/drv-registry/report.json',
            'artifacts/drv-registry/report.md',
            'artifacts/drv-registry/discovery-sample.json',
            'artifacts/lrv-enrichment/report.json',
            'artifacts/lrv-enrichment/report.md',
            'artifacts/lrv-laenderrat/report.json',
            'artifacts/lrv-laenderrat/report.md',
            'artifacts/snapshot/baseline-registry.json',
            'artifacts/snapshot/baseline-registry.md',
            'artifacts/snapshot/report.json',
            'artifacts/snapshot/report.md',
            'artifacts/pilot-100/sample.json',
            'artifacts/pilot-100/report.json',
            'artifacts/pilot-100/report.md',
            'dist/data/clubs.json'
          ].map((file) => fs.readFileSync(file, 'utf8')).join('\n');
          const email = /[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i;
          if (email.test(publicRaw)) throw new Error('public registry/LRV/snapshot/pilot artifacts must not expose email addresses');

          console.log({
            registry: report,
            lrvEnrichment: lrv.summary,
            laenderrat: {
              matchedOrganizations: laenderrat.matchedOrganizations,
              candidateCount: laenderrat.candidateCount,
              autoApprovedCandidateCount: laenderrat.autoApprovedCandidateCount,
              reviewCandidateCount: laenderrat.reviewCandidateCount
            },
            snapshotBefore: { directApproved: baseline.directApproved, routeCounts: baseline.routeCounts },
            snapshotAfter: { directApproved: snapshot.directApproved, routeCounts: snapshot.routeCounts },
            pilot: {
              sample: pilot.sample,
              sampleHash: pilot.sampleHash,
              states: pilot.sampleStates.length,
              routeCounts: pilot.routeCounts,
              websiteStatusCounts: pilot.websiteStatusCounts,
              schemeCounts: pilot.schemeCounts,
              mandatoryIncluded: pilot.mandatoryIncluded
            },
            discoverySample: { organizations: discoverySample.organizations.length, states: discoveryStates.size }
          });
          NODE

      - name: Add quality reports to workflow summary
        run: |
          cat artifacts/drv-registry/report.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/lrv-enrichment/report.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/lrv-laenderrat/report.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '# Snapshot vor LRV-Enrichment\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/snapshot/baseline-registry.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n---\n\n# Snapshot nach LRV-Enrichment\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/snapshot/report.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/pilot-100/report.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const sample = JSON.parse(fs.readFileSync('artifacts/drv-registry/discovery-sample.json', 'utf8'));
          const states = new Set(sample.organizations.map((item) => item.state).filter(Boolean));
          console.log(`## PoC-B-Stichprobe\n\n- Organisationen ohne DRV-Weblink im Test: **${sample.organizations.length}**\n- Bundesländer: **${states.size}**\n- keine E-Mail-Adressen im Artifact`);
          NODE

      - name: Upload public registry, LRV, pilot and snapshot quality reports
        uses: actions/upload-artifact@v4
        with:
          name: drv-registry-quality-report
          path: |
            artifacts/drv-registry/
            artifacts/lrv-enrichment/
            artifacts/lrv-laenderrat/
            artifacts/pilot-100/
            artifacts/snapshot/
            dist/data/clubs.json
          if-no-files-found: error
          retention-days: 14
