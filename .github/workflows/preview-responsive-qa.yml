name: Preview responsive QA

on:
  push:
    branches: [refactor/shared-site-shell]
    paths:
      - .github/workflows/preview-responsive-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run responsive preview acceptance
        env:
          BASE_URL: https://preview.adams-erben.de
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');

          const baseUrl = process.env.BASE_URL;
          const widths = [390, 430, 768, 1024];
          const routes = [
            { path: '/', variant: 'landing', cta: '#quick-finder', inPageNav: true },
            { path: '/rudern/', variant: 'rowing', cta: '#vereine', inPageNav: true },
            { path: '/deutschlandachter-1960/', variant: 'content', cta: '/ruderverein-finden/', inPageNav: false }
          ];

          const outDir = path.resolve('qa-artifacts');
          fs.mkdirSync(outDir, { recursive: true });
          const results = [];
          const failures = [];

          function record(route, width, check, ok, details = '') {
            const row = { route, width, check, ok, details };
            results.push(row);
            if (!ok) failures.push(row);
            console.log(`${ok ? 'PASS' : 'FAIL'} ${width}px ${route} :: ${check}${details ? ` — ${details}` : ''}`);
          }

          async function isVisible(locator) {
            try { return await locator.isVisible(); } catch { return false; }
          }

          const browser = await chromium.launch({ headless: true });
          try {
            for (const width of widths) {
              for (const route of routes) {
                const context = await browser.newContext({
                  viewport: { width, height: 1000 },
                  deviceScaleFactor: 1,
                  reducedMotion: 'reduce'
                });
                const page = await context.newPage();
                const url = `${baseUrl}${route.path === '/' ? '/' : route.path}`;

                let response = null;
                let lastError = null;
                for (let attempt = 1; attempt <= 6; attempt += 1) {
                  try {
                    response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 20000 });
                    if (response && response.status() < 500) break;
                  } catch (error) {
                    lastError = error;
                  }
                  await page.waitForTimeout(5000);
                }

                if (!response) {
                  record(route.path, width, 'HTTP reachable', false, lastError?.message || 'no response');
                  await context.close();
                  continue;
                }

                record(route.path, width, 'HTTP 200', response.status() === 200, `status=${response.status()}`);
                await page.waitForTimeout(500);

                const shellState = await page.evaluate(() => ({
                  path: document.body?.dataset.shellPath || '',
                  variant: document.body?.dataset.shellVariant || '',
                  shellCss: Boolean(document.querySelector('link[href="/assets/site-shell.css"]')),
                  shellHeader: Boolean(document.querySelector('.site-header[data-site-shell="header"]')),
                  robots: document.querySelector('meta[name="robots"]')?.content || '',
                  previewText: document.querySelector('#preview-banner')?.textContent?.replace(/\s+/g, ' ').trim() || ''
                }));
                record(route.path, width, 'deployed shared-shell branch marker', shellState.path === route.path && shellState.variant === route.variant && shellState.shellCss && shellState.shellHeader,
                  `path=${shellState.path || '(missing)'}, variant=${shellState.variant || '(missing)'}`);
                record(route.path, width, 'preview noindex', shellState.robots === 'noindex,nofollow', `robots=${shellState.robots || '(missing)'}`);
                record(route.path, width, 'preview banner', /Prototyp/i.test(shellState.previewText), shellState.previewText.slice(0, 120));

                const header = page.locator('.site-header').first();
                const headerMetricsBefore = await header.evaluate((el) => {
                  const rect = el.getBoundingClientRect();
                  const style = getComputedStyle(el);
                  return { top: rect.top, bottom: rect.bottom, height: rect.height, position: style.position, zIndex: style.zIndex };
                });
                record(route.path, width, 'fixed/sticky header mode', ['fixed', 'sticky'].includes(headerMetricsBefore.position), `position=${headerMetricsBefore.position}, height=${headerMetricsBefore.height.toFixed(1)}`);

                await page.evaluate(() => window.scrollTo(0, Math.min(700, document.documentElement.scrollHeight - innerHeight)));
                await page.waitForTimeout(150);
                const headerTopAfter = await header.evaluate((el) => el.getBoundingClientRect().top);
                record(route.path, width, 'header remains pinned after scroll', Math.abs(headerTopAfter) <= 1.5, `top=${headerTopAfter.toFixed(1)}`);

                await page.evaluate(() => window.scrollTo(0, 0));
                await page.waitForTimeout(100);

                const toggle = page.locator('.menu-toggle').first();
                const nav = page.locator('#primary-navigation').first();
                const mobile = width <= 920;
                const toggleVisible = await isVisible(toggle);
                const navVisibleInitially = await isVisible(nav);
                record(route.path, width, 'responsive hamburger visibility', mobile ? toggleVisible : !toggleVisible,
                  `toggleVisible=${toggleVisible}, mobileExpected=${mobile}`);
                record(route.path, width, 'responsive nav initial state', mobile ? !navVisibleInitially : navVisibleInitially,
                  `navVisible=${navVisibleInitially}`);

                if (mobile && toggleVisible) {
                  const beforeExpanded = await toggle.getAttribute('aria-expanded');
                  await toggle.click();
                  await page.waitForTimeout(100);
                  const afterExpanded = await toggle.getAttribute('aria-expanded');
                  const navVisibleOpen = await isVisible(nav);
                  record(route.path, width, 'hamburger opens menu', beforeExpanded === 'false' && afterExpanded === 'true' && navVisibleOpen,
                    `aria ${beforeExpanded}→${afterExpanded}, navVisible=${navVisibleOpen}`);
                }

                const mobileCta = page.locator('.header-find-club').first();
                const desktopCta = page.locator('#primary-navigation .nav-cta').first();
                const activeCta = mobile ? mobileCta : desktopCta;
                const ctaVisible = await isVisible(activeCta);
                const ctaHref = await activeCta.getAttribute('href');
                record(route.path, width, 'CTA visible and correct', ctaVisible && ctaHref === route.cta,
                  `visible=${ctaVisible}, href=${ctaHref || '(missing)'}`);

                const overflow = await page.evaluate(() => ({
                  scrollWidth: document.documentElement.scrollWidth,
                  innerWidth: window.innerWidth
                }));
                record(route.path, width, 'no horizontal viewport overflow', overflow.scrollWidth <= overflow.innerWidth + 1,
                  `scrollWidth=${overflow.scrollWidth}, innerWidth=${overflow.innerWidth}`);

                const h1Metrics = await page.locator('h1').first().evaluate((el) => {
                  const rect = el.getBoundingClientRect();
                  const style = getComputedStyle(el);
                  const lineHeight = parseFloat(style.lineHeight) || parseFloat(style.fontSize) * 1.2;
                  return {
                    text: el.textContent.replace(/\s+/g, ' ').trim(),
                    left: rect.left,
                    right: rect.right,
                    width: rect.width,
                    height: rect.height,
                    scrollWidth: el.scrollWidth,
                    clientWidth: el.clientWidth,
                    lines: Math.max(1, Math.round(rect.height / lineHeight)),
                    overflowWrap: style.overflowWrap,
                    wordBreak: style.wordBreak,
                    hyphens: style.hyphens
                  };
                });
                const h1Fits = h1Metrics.left >= -1 && h1Metrics.right <= width + 1 && h1Metrics.scrollWidth <= h1Metrics.clientWidth + 1;
                record(route.path, width, 'H1 wraps without clipping', h1Fits,
                  `lines≈${h1Metrics.lines}, right=${h1Metrics.right.toFixed(1)}, scroll/client=${h1Metrics.scrollWidth}/${h1Metrics.clientWidth}`);
                if (route.path === '/deutschlandachter-1960/') {
                  record(route.path, width, 'Deutschlandachter H1 present', /Deutschlandachter/.test(h1Metrics.text), h1Metrics.text);
                }

                if (route.inPageNav) {
                  const anchors = await page.locator('#primary-navigation a[href^="#"]').evaluateAll((els) => els.map((el) => el.getAttribute('href')));
                  const targetCheck = await page.evaluate((hrefs) => hrefs.map((href) => ({ href, exists: Boolean(href && document.querySelector(href)) })), anchors);
                  record(route.path, width, 'all shell in-page targets exist', targetCheck.length > 0 && targetCheck.every((item) => item.exists), JSON.stringify(targetCheck));

                  const firstHref = targetCheck.find((item) => item.exists)?.href;
                  if (firstHref) {
                    const link = page.locator(`#primary-navigation a[href="${firstHref}"]`).first();
                    await link.click();
                    await page.waitForTimeout(200);
                    const navResult = await page.evaluate((href) => {
                      const target = document.querySelector(href);
                      const header = document.querySelector('.site-header');
                      if (!target || !header) return null;
                      return {
                        hash: location.hash,
                        targetTop: target.getBoundingClientRect().top,
                        headerBottom: header.getBoundingClientRect().bottom
                      };
                    }, firstHref);
                    record(route.path, width, 'in-page navigation click works', Boolean(navResult && navResult.hash === firstHref && navResult.targetTop >= navResult.headerBottom - 3),
                      navResult ? `hash=${navResult.hash}, targetTop=${navResult.targetTop.toFixed(1)}, headerBottom=${navResult.headerBottom.toFixed(1)}` : 'missing target/header');
                  }
                } else {
                  await page.evaluate(() => window.scrollTo(0, 0));
                  const skip = page.locator('.skip-link[href="#inhalt"]').first();
                  const skipExists = await skip.count() === 1;
                  if (skipExists) {
                    await skip.evaluate((el) => el.click());
                    await page.waitForTimeout(150);
                  }
                  const skipResult = await page.evaluate(() => {
                    const target = document.querySelector('#inhalt');
                    const header = document.querySelector('.site-header');
                    if (!target || !header) return null;
                    return { hash: location.hash, targetTop: target.getBoundingClientRect().top, headerBottom: header.getBoundingClientRect().bottom };
                  });
                  record(route.path, width, 'content skip/in-page navigation works', Boolean(skipResult && skipResult.hash === '#inhalt' && skipResult.targetTop >= skipResult.headerBottom - 3),
                    skipResult ? `hash=${skipResult.hash}, targetTop=${skipResult.targetTop.toFixed(1)}, headerBottom=${skipResult.headerBottom.toFixed(1)}` : 'missing skip target/header');
                }

                await page.evaluate(() => window.scrollTo(0, 0));
                await page.waitForTimeout(100);
                const safeName = route.path === '/' ? 'root' : route.path.replace(/^\/+|\/+$/g, '').replaceAll('/', '-');
                await page.screenshot({ path: path.join(outDir, `${safeName}-${width}.png`), fullPage: true });
                await context.close();
              }
            }
          } finally {
            await browser.close();
          }

          fs.writeFileSync(path.join(outDir, 'results.json'), JSON.stringify({ baseUrl, results, failures }, null, 2));
          const byCheck = results.reduce((acc, row) => {
            acc[row.check] ||= { pass: 0, fail: 0 };
            acc[row.check][row.ok ? 'pass' : 'fail'] += 1;
            return acc;
          }, {});
          console.log('\n=== QA SUMMARY ===');
          console.log(JSON.stringify(byCheck, null, 2));
          console.log(`Failures: ${failures.length}`);
          if (failures.length) process.exit(1);
          NODE

      - name: Upload responsive QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-responsive-qa
          path: qa-artifacts
          if-no-files-found: warn
