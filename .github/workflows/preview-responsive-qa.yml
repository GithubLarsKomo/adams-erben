name: Preview responsive QA

on:
  push:
    branches: [refactor/shared-site-shell]
    paths:
      - .github/workflows/preview-responsive-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run responsive preview acceptance
        env:
          BASE_URL: https://preview.adams-erben.de
        run: node scripts/preview-responsive-qa.mjs

      - name: Upload responsive QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-responsive-qa
          path: qa-artifacts
          if-no-files-found: warn
