name: Source shell cleanup

on:
  push:
    branches: [refactor/shared-site-shell]
    paths:
      - scripts/clean-source-shell-fragments.mjs
      - .github/workflows/source-shell-cleanup.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/shared-site-shell

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Remove legacy shell fragments from SEO sources
        run: node scripts/clean-source-shell-fragments.mjs

      - name: Validate diff
        run: |
          git diff --check
          if git diff --quiet; then
            echo "SEO source files are already clean."
          else
            git diff --stat
          fi

      - name: Commit cleaned sources
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/adams-acht/index.html \
                  src/deutschlandachter-1960/index.html \
                  src/karl-adam-trainingsmethoden/index.html \
                  src/karl-adam/index.html \
                  src/ratzeburg/index.html \
                  src/rudern-lernen/index.html \
                  src/rudern-verstehen/index.html \
                  src/ruderverein-finden/index.html \
                  src/ueber-adams-erben/index.html
          git commit -m "refactor: remove legacy shell fragments from SEO sources"
          git push origin HEAD:refactor/shared-site-shell
