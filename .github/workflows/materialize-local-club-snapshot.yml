name: Materialize Local Club Snapshot

on:
  push:
    branches: [feat/karl-adam-local-cooperation]
    paths:
      - '.github/workflows/materialize-local-club-snapshot.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/karl-adam-local-cooperation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund

      - name: Teach local build to prefer checked-in full snapshot
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const buildPath = 'scripts/build.mjs';
          let build = fs.readFileSync(buildPath, 'utf8');
          const pathsBefore = "const seedPath = path.join(dist, 'data', 'clubs.seed.json');\nconst publicPath = path.join(dist, 'data', 'clubs.json');";
          const pathsAfter = "const seedPath = path.join(dist, 'data', 'clubs.seed.json');\nconst snapshotPath = path.join(dist, 'data', 'clubs.snapshot.json');\nconst publicPath = path.join(dist, 'data', 'clubs.json');";
          if (!build.includes(pathsBefore) && !build.includes("const snapshotPath = path.join(dist, 'data', 'clubs.snapshot.json');")) {
            throw new Error('Could not locate build data-path block');
          }
          build = build.replace(pathsBefore, pathsAfter);

          const fallbackBefore = "  const seed = await readFile(seedPath, 'utf8');\n  const postalSeed = await readFile(postalSeedPath, 'utf8');\n  await writeFile(publicPath, seed);\n  await writeFile(postalPublicPath, postalSeed);";
          const fallbackAfter = "  let clubDataPath = seedPath;\n  let clubDataLabel = 'checked-in demo seed';\n  if (process.env.USE_CLUB_SNAPSHOT === '1') {\n    try {\n      await readFile(snapshotPath, 'utf8');\n      clubDataPath = snapshotPath;\n      clubDataLabel = 'checked-in full club snapshot';\n    } catch (snapshotError) {\n      if (snapshotError?.code !== 'ENOENT') throw snapshotError;\n      console.warn('[build] full club snapshot missing; falling back to demo seed.');\n    }\n  }\n  const clubData = await readFile(clubDataPath, 'utf8');\n  const postalSeed = await readFile(postalSeedPath, 'utf8');\n  await writeFile(publicPath, clubData);\n  await writeFile(postalPublicPath, postalSeed);\n  console.warn(`[build] using ${clubDataLabel}.`);";
          if (!build.includes(fallbackBefore) && !build.includes("clubDataLabel = 'checked-in full club snapshot'")) {
            throw new Error('Could not locate build fallback block');
          }
          build = build.replace(fallbackBefore, fallbackAfter);

          const cleanupBefore = "await rm(seedPath, { force: true });\nawait rm(postalSeedPath, { force: true });";
          const cleanupAfter = "await rm(seedPath, { force: true });\nawait rm(snapshotPath, { force: true });\nawait rm(postalSeedPath, { force: true });";
          if (!build.includes(cleanupBefore) && !build.includes("await rm(snapshotPath, { force: true });")) {
            throw new Error('Could not locate build cleanup block');
          }
          build = build.replace(cleanupBefore, cleanupAfter);
          fs.writeFileSync(buildPath, build);

          const localPath = 'scripts/build-local.mjs';
          let local = fs.readFileSync(localPath, 'utf8');
          const localBefore = "process.env.SKIP_DRV_SYNC = '1';";
          const localAfter = "process.env.SKIP_DRV_SYNC = '1';\nprocess.env.USE_CLUB_SNAPSHOT = '1';";
          if (!local.includes(localBefore)) throw new Error('Could not locate local build flag');
          if (!local.includes("process.env.USE_CLUB_SNAPSHOT = '1';")) local = local.replace(localBefore, localAfter);
          fs.writeFileSync(localPath, local);
          NODE

      - name: Build fresh real DRV snapshot
        env:
          REQUIRE_DRV_SYNC: '1'
        run: npm run build

      - name: Persist sanitized browser dataset as local snapshot
        run: |
          cp dist/data/clubs.json src/data/clubs.snapshot.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('src/data/clubs.snapshot.json', 'utf8'));
          const orgs = data.organizations || [];
          const logos = orgs.filter((org) => org.logoStatus === 'present' && String(org.logo || '').startsWith('/assets/images/clubs/'));
          const raw = fs.readFileSync('src/data/clubs.snapshot.json', 'utf8');
          const emails = raw.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/ig) || [];
          console.log(`[snapshot] organizations=${orgs.length}, localLogos=${logos.length}, emails=${emails.length}`);
          if (orgs.length < 400) throw new Error(`Snapshot unexpectedly small: ${orgs.length}`);
          if (logos.length < 200) throw new Error(`Snapshot unexpectedly has too few logos: ${logos.length}`);
          if (emails.length) throw new Error(`Snapshot must not expose email addresses: ${emails.slice(0, 3).join(', ')}`);
          NODE

      - name: Verify local build now uses full snapshot without network sync
        run: |
          npm run build:local
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('dist/data/clubs.json', 'utf8'));
          const orgs = data.organizations || [];
          const logos = orgs.filter((org) => org.logoStatus === 'present' && String(org.logo || '').startsWith('/assets/images/clubs/'));
          console.log(`[local-build] organizations=${orgs.length}, localLogos=${logos.length}`);
          if (orgs.length < 400) throw new Error(`Local build still uses demo seed: ${orgs.length}`);
          if (logos.length < 200) throw new Error(`Local build exposes too few logos: ${logos.length}`);
          for (const org of logos) {
            const asset = `dist${org.logo}`;
            if (!fs.existsSync(asset)) throw new Error(`Missing logo asset ${asset}`);
          }
          NODE

      - name: Commit snapshot architecture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build.mjs scripts/build-local.mjs src/data/clubs.snapshot.json
          git commit -m "use full sanitized club snapshot for local builds"
          git push origin HEAD:feat/karl-adam-local-cooperation

# Registered workflow; this change triggers the one-time materialization run.
