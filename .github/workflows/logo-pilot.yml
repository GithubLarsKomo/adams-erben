name: Club Logo Pilot

on:
  push:
    branches: [feat/club-logo-enrichment]
    paths:
      - '.github/workflows/logo-pilot.yml'

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build live DRV organization dataset
        env:
          REQUIRE_DRV_SYNC: '1'
        run: npm run sync:drv

      - name: Run 20-organization logo pilot
        env:
          LOGO_SYNC_LIMIT: '20'
          LOGO_SYNC_FORCE: '1'
          LOGO_SYNC_CONCURRENCY: '3'
        run: npm run logos:sync

      - name: Show pilot report
        if: always()
        run: |
          test -f artifacts/logo-sync/report.json && cat artifacts/logo-sync/report.json || true
          test -f src/data/club-logos.json && cat src/data/club-logos.json || true

      - name: Upload pilot results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: club-logo-pilot-20-v2-aliases
          if-no-files-found: warn
          retention-days: 7
          path: |
            artifacts/logo-sync/report.json
            src/data/club-logos.json
            src/assets/images/clubs/
