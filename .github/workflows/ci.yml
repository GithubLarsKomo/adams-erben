name: CI

on:
  push:
    branches: [main, feat/mvp-wayfinder, feat/karl-adam-local-cooperation, feat/direct-club-contact-nearest, feat/seo-discoverability]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend/build dependencies
        run: npm install --no-audit --no-fund

      - name: JavaScript syntax
        run: |
          node --check scripts/build.mjs
          node --check scripts/postbuild-seo.mjs
          node --check scripts/seo-pages.mjs
          node --check scripts/validate-seo-output.mjs
          node --check scripts/sync-drv.mjs
          node --check scripts/build-snapshot.mjs
          node --check scripts/validate-drv-output.mjs
          node --check scripts/validate-drv-output.test.mjs
          node --check src/assets/app.js
          node --check src/assets/nearest.js

      - name: No remote asset fallback in build source
        shell: bash
        run: |
          if grep -nE "fallback:[[:space:]]*['\"]https?://|onerror=.*https?://" scripts/build.mjs; then
            echo 'Remote runtime asset fallbacks are forbidden.' >&2
            exit 1
          fi

      - name: DRV output validator tests
        run: npm run test:drv-output

      - name: Direct-only snapshot tests
        run: npm run test:snapshot

      - name: Local nearest-club tests
        run: npm run test:nearest

      - name: Production build with SEO validation
        env:
          SKIP_DRV_SYNC: '1'
        run: npm run build

      - name: HTTP smoke test for canonical pages and local brand assets
        shell: bash
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/adams-erben-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1

          pages=(
            /
            /karl-adam/
            /adams-acht/
            /deutschlandachter-1960/
            /ratzeburg/
            /karl-adam-trainingsmethoden/
            /rudern-verstehen/
            /rudern-lernen/
            /ruderverein-finden/
            /ueber-adams-erben/
          )

          for page in "${pages[@]}"; do
            status=$(curl --silent --show-error --output /tmp/adams-page.html --write-out '%{http_code}' "http://127.0.0.1:4173${page}")
            if [ "$status" != "200" ]; then
              echo "Expected HTTP 200 for ${page}, got ${status}" >&2
              cat /tmp/adams-erben-http.log >&2
              exit 1
            fi
            if ! grep -qi '<!doctype html' /tmp/adams-page.html; then
              echo "Expected HTML document for ${page}" >&2
              exit 1
            fi
          done

          assets=(
            /assets/images/world-rowing.png
            /assets/images/drv.png
            /assets/images/schubschlag.webp
          )

          for asset in "${assets[@]}"; do
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:4173${asset}")
            if [ "$status" != "200" ]; then
              echo "Expected local brand asset ${asset}, got HTTP ${status}" >&2
              exit 1
            fi
          done

          kill "$server_pid"
          trap - EXIT

      - name: Assert browser data contains no email addresses
        shell: bash
        run: |
          if grep -R -E -i '[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}' dist/data; then
            echo 'Public browser data must not contain email addresses.' >&2
            exit 1
          fi

      - name: Validate generated search data
        run: |
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('dist/data/clubs.json','utf8')); if(!Array.isArray(d.organizations)||d.organizations.length<1) process.exit(1); const r=d.organizations.find(x=>x.id==='ratzeburger-ruderclub-ev'); if(!r||!r.featured) process.exit(1); const p=JSON.parse(fs.readFileSync('dist/data/postal-locations.json','utf8')); if(!Array.isArray(p.locations)||p.locations.length<1) process.exit(1); console.log('organizations:',d.organizations.length,'postal locations:',p.locations.length)"

      - name: Validate seed fallback routing metadata
        run: |
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('build-private/recipients.json','utf8')); if(d.routingMode!=='direct-only'||Object.keys(d.recipients||{}).length!==0) process.exit(1); console.log('routingMode:',d.routingMode)"

      - name: PHP syntax
        run: |
          php -v
          php -l api/contact.php
          php -l api/health.php
          php -l legal/impressum.php
          php -l legal/datenschutz.php
          php -l legal/rechtliche-hinweise.php

      - name: Preview build with noindex validation
        env:
          SKIP_DRV_SYNC: '1'
          PREVIEW_MODE: '1'
        run: npm run build
