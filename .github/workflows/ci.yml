name: CI

on:
  push:
    branches: [main, feat/mvp-wayfinder, feat/karl-adam-local-cooperation]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend/build dependencies
        run: npm install --no-audit --no-fund

      - name: JavaScript syntax
        run: |
          node --check scripts/build.mjs
          node --check scripts/sync-drv.mjs
          node --check scripts/validate-drv-output.mjs
          node --check scripts/validate-drv-output.test.mjs
          node --check src/assets/app.js

      - name: DRV output validator tests
        run: npm run test:drv-output

      - name: Build with checked-in seed
        env:
          SKIP_DRV_SYNC: '1'
        run: npm run build

      - name: Assert browser data contains no email addresses
        shell: bash
        run: |
          if grep -R -E -i '[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}' dist/data; then
            echo 'Public browser data must not contain email addresses.' >&2
            exit 1
          fi

      - name: Validate generated search data
        run: |
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('dist/data/clubs.json','utf8')); if(!Array.isArray(d.organizations)||d.organizations.length<1) process.exit(1); const r=d.organizations.find(x=>x.id==='ratzeburger-ruderclub-ev'); if(!r||!r.featured) process.exit(1); console.log('organizations:',d.organizations.length)"

      - name: Validate seed fallback routing metadata
        run: |
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('build-private/recipients.json','utf8')); if(d.routingMode!=='drv-only-fallback'||Object.keys(d.recipients||{}).length!==0) process.exit(1); console.log('routingMode:',d.routingMode)"

      - name: PHP syntax
        run: |
          php -v
          php -l api/contact.php
          php -l api/health.php
          php -l legal/impressum.php
          php -l legal/datenschutz.php
          php -l legal/rechtliche-hinweise.php
