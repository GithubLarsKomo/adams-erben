name: CI

on:
  push:
    branches: [main, feat/mvp-wayfinder, feat/karl-adam-local-cooperation, feat/direct-club-contact-nearest, feat/landingpage-kinobesucher, feat/club-logo-enrichment, refactor/shared-site-shell]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend/build dependencies
        run: npm install --no-audit --no-fund

      - name: JavaScript syntax
        run: |
          node --check scripts/build.mjs
          node --check scripts/build-local.mjs
          node --check scripts/split-audiences.mjs
          node --check scripts/apply-site-shell.mjs
          node --check scripts/validate-site-shell.mjs
          node --check scripts/lib/site-shell.mjs
          node --check scripts/sync-drv.mjs
          node --check scripts/build-snapshot.mjs
          node --check scripts/validate-drv-output.mjs
          node --check scripts/validate-drv-output.test.mjs
          node --check scripts/sync-club-logos.mjs
          node --check scripts/apply-club-logo-manifest.mjs
          node --check scripts/lib/logo-discovery.mjs
          node --check scripts/lib/logo-manifest.mjs
          node --check src/assets/app.js
          node --check src/assets/nearest.js
          node --check src/assets/site-shell.js

      - name: Club logo enrichment tests
        run: npm run test:logos

      - name: DRV output validator tests
        run: npm run test:drv-output

      - name: Direct-only snapshot tests
        run: npm run test:snapshot

      - name: Local nearest-club tests
        run: npm run test:nearest

      - name: Local build with checked-in seed
        run: npm run build:local

      - name: Validate shared site shell
        run: npm run validate:shell

      - name: Validate audience pages
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const landing = fs.readFileSync('dist/index.html', 'utf8');
          const rowing = fs.readFileSync('dist/rudern/index.html', 'utf8');
          const checks = [
            [landing.includes('id="quick-finder"'), 'landing quick finder'],
            [landing.includes('id="vereine"') && landing.includes('hidden=""'), 'landing progressive directory'],
            [landing.includes('href="/rudern/"'), 'landing link to rowing page'],
            [!landing.includes('id="labor"'), 'landing excludes full Adams Labor'],
            [rowing.includes('id="labor"'), 'rowing page includes Adams Labor'],
            [rowing.includes('id="rudern-verstehen"'), 'rowing page includes rowing explainer'],
            [!rowing.includes('id="film"'), 'rowing page excludes film-first section'],
            [rowing.includes('href="/"'), 'rowing page links back to entry page']
          ];
          for (const [ok, label] of checks) {
            if (!ok) {
              console.error('Audience-page assertion failed:', label);
              process.exit(1);
            }
          }
          console.log('Audience pages validated.');
          NODE

      - name: Assert browser data contains no email addresses
        shell: bash
        run: |
          if grep -R -E -i '[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}' dist/data; then
            echo 'Public browser data must not contain email addresses.' >&2
            exit 1
          fi

      - name: Validate generated search data
        run: |
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('dist/data/clubs.json','utf8')); if(!Array.isArray(d.organizations)||d.organizations.length<1) process.exit(1); const r=d.organizations.find(x=>x.id==='ratzeburger-ruderclub-ev'); if(!r||!r.featured) process.exit(1); const p=JSON.parse(fs.readFileSync('dist/data/postal-locations.json','utf8')); if(!Array.isArray(p.locations)||p.locations.length<1) process.exit(1); console.log('organizations:',d.organizations.length,'postal locations:',p.locations.length)"

      - name: Validate seed fallback routing metadata
        run: |
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('build-private/recipients.json','utf8')); if(d.routingMode!=='direct-only'||Object.keys(d.recipients||{}).length!==0) process.exit(1); console.log('routingMode:',d.routingMode)"

      - name: PHP syntax
        run: |
          php -v
          php -l api/contact.php
          php -l api/health.php
          php -l legal/impressum.php
          php -l legal/datenschutz.php
          php -l legal/rechtliche-hinweise.php
