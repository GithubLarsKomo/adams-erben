name: Patch Club Logo Presentation

on:
  push:
    branches: [feat/karl-adam-local-cooperation]
    paths:
      - '.github/workflows/patch-club-logo-presentation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/karl-adam-local-cooperation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund

      - name: Remove logo frame and preserve intrinsic proportions
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'src/assets/styles.css';
          let css = fs.readFileSync(file, 'utf8');
          const desktop = [
            '.club-logo {',
            '  width: 78px;',
            '  height: 78px;',
            '  margin: 0;',
            '  padding: 0;',
            '  display: flex;',
            '  align-items: center;',
            '  justify-content: center;',
            '  border: 0;',
            '  border-radius: 0;',
            '  background: var(--white);',
            '  box-shadow: none;',
            '  overflow: visible;',
            '}',
            '.club-logo img {',
            '  display: block;',
            '  width: auto;',
            '  height: auto;',
            '  max-width: 100%;',
            '  max-height: 100%;',
            '  object-fit: contain;',
            '  object-position: center;',
            '}'
          ].join('\n');
          const desktopPattern = /\.club-logo \{\n[\s\S]*?\n\}\n\.club-logo img \{\n[\s\S]*?\n\}/;
          if (!desktopPattern.test(css)) throw new Error('Expected desktop club-logo CSS block not found');
          css = css.replace(desktopPattern, desktop);
          const mobilePattern = /\.club-logo \{ width: 64px; height: 64px; border-radius: 12px; padding: \.35rem; \}/;
          if (!mobilePattern.test(css)) throw new Error('Expected mobile club-logo CSS block not found');
          css = css.replace(mobilePattern, '.club-logo { width: 64px; height: 64px; }');
          fs.writeFileSync(file, css);
          NODE

      - name: Assert borderless proportional logo CSS
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const css = fs.readFileSync('src/assets/styles.css', 'utf8');
          const figure = css.match(/\.club-logo \{[\s\S]*?\n\}/)?.[0] || '';
          const image = css.match(/\.club-logo img \{[\s\S]*?\n\}/)?.[0] || '';
          for (const rule of ['padding: 0;', 'border: 0;', 'border-radius: 0;', 'background: var(--white);']) {
            if (!figure.includes(rule)) throw new Error('Missing frame rule: ' + rule);
          }
          for (const rule of ['width: auto;', 'height: auto;', 'max-width: 100%;', 'max-height: 100%;']) {
            if (!image.includes(rule)) throw new Error('Missing proportional image rule: ' + rule);
          }
          if (/^\s*width:\s*100%;/m.test(image) || /^\s*height:\s*100%;/m.test(image)) {
            throw new Error('Logo image is still forced to fill both dimensions');
          }
          console.log('Borderless white logo slot and intrinsic aspect-ratio scaling verified.');
          NODE

      - name: Validate local build
        run: npm run build:local

      - name: Commit presentation fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/styles.css
          git commit -m "render club logos borderless with original proportions"
          git push origin HEAD:feat/karl-adam-local-cooperation
